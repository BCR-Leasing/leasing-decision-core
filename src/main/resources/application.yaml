server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: leasing-decision-core

  liquibase:
    enabled: false

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

    hikari:
      read-only: true
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:10000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT:5000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    try-it-out-enabled: true

  packages-to-scan:
    - ro.bcrleasing.leasingdecisioncore.blacklist.api
    - ro.bcrleasing.leasingdecisioncore.dowjones.api

  paths-to-match:
    - /api/v1/blacklist/**
    - /api/v1/dow-jones/**

decision-core:
  capabilities:
    sibcor:
      base-url: ${SIBCOR_BASE_URL:https://apilb.bcr.wan/api/v1/bcrleasing/}
      blacklist-path: ${SIBCOR_BLACKLIST_PATH:blacklist}
      auth-base-url: ${SIBCOR_AUTH_BASE_URL:https://authlb.bcr.wan/authserver/oauth/token}
      auth-client-id: ${SIBCOR_AUTH_CLIENT_ID}
      auth-grant-type: ${SIBCOR_AUTH_GRANT_TYPE}
      auth-username: ${SIBCOR_AUTH_USERNAME}
      auth-password: ${SIBCOR_AUTH_PASSWORD}
      connect-timeout: ${SIBCOR_CONNECT_TIMEOUT:5s}
      read-timeout: ${SIBCOR_READ_TIMEOUT:30s}
      token-refresh-before-expiry: ${SIBCOR_TOKEN_REFRESH_BEFORE_EXPIRY:5m}
      fallback-token-ttl: ${SIBCOR_FALLBACK_TOKEN_TTL:50m}

    dow-jones:
      url: ${DOW_JONES_URL:https://riskcenter.dowjones.com/dashboard}
      username: ${DOW_JONES_USERNAME}
      password: ${DOW_JONES_PASSWORD}
      headless: ${DOW_JONES_HEADLESS:true}
      ignore-https-errors: ${DOW_JONES_IGNORE_HTTPS_ERRORS:false}
      browser-executable-path: ${DOW_JONES_BROWSER_EXECUTABLE_PATH}
      slow-mo-ms: ${DOW_JONES_SLOW_MO_MS:250}
      navigation-timeout: ${DOW_JONES_NAVIGATION_TIMEOUT:30s}
      search-timeout: ${DOW_JONES_SEARCH_TIMEOUT:60s}
      download-timeout: ${DOW_JONES_DOWNLOAD_TIMEOUT:60s}
      max-concurrent-screenings: ${DOW_JONES_MAX_CONCURRENT_SCREENINGS:1}
      max-pages: ${DOW_JONES_MAX_PAGES:50}
      max-pdf-bytes: ${DOW_JONES_MAX_PDF_BYTES:26214400}
      document-ttl: ${DOW_JONES_DOCUMENT_TTL:60m}
      document-directory: ${DOW_JONES_RESULT_PATH}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always